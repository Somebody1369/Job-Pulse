# Render Blueprint for a free demo: the dashboard, API and admin run on a free web service with a
# free PostgreSQL database. Free instances sleep and Render has no free workers, so the Scheduled
# tasks GitHub Actions workflow collects the data instead of Celery.
services:
  - type: web
    name: jobpulse
    runtime: docker
    plan: free
    region: frankfurt
    dockerCommand: ./deploy/render-start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobpulse-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SECURE_COOKIES
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"

databases:
  - name: jobpulse-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: jobpulse
    user: jobpulse
