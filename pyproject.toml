[project]
name = "jobpulse"
version = "0.1.0"
description = "Job market analytics for the Ukrainian IT market: collects, normalizes and analyzes vacancies."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "beautifulsoup4>=4.15.0",
    "celery[redis]>=5.6.3",
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "django-stubs-ext>=6.1.2",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "selenium>=4.50.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "responses>=0.26.3",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-openpyxl>=3.1.5.20260827",
    "types-requests>=2.33.0.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "C4", "UP", "SIM", "RET", "PTH",
    "ARG", "PT", "DJ", "S", "T20", "PL", "RUF",
]

allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"*/admin.py" = ["RUF012"]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["environ.*", "django_filters.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["api.filters"]
disallow_subclassing_any = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
markers = ["e2e: browser tests that drive a real Chrome through Selenium"]

[tool.coverage.run]
source = ["analytics", "api", "config", "core", "market", "subscriptions", "vacancies"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
