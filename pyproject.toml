[project]
name = "jobpulse"
version = "0.1.0"
description = "Job market analytics for the Ukrainian IT market: collects, normalizes and analyzes vacancies."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "celery[redis]>=5.6.3",
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "django-stubs-ext>=6.1.2",
    "gunicorn>=26.2.0",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "django-stubs[compatible-mypy]>=6.1.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "responses>=0.26.3",
    "ruff>=0.16.10",
    "types-requests>=2.33.0.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "C4", "UP", "SIM", "RET", "PTH",
    "ARG", "PT", "DJ", "S", "T20", "PL", "RUF",
]

allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"*/admin.py" = ["RUF012"]
"tests/**" = ["S101", "PLR2004", "RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["/migrations/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["config", "core", "market", "vacancies"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
